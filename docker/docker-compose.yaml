name: peak-ros

services:
  peak-ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
      args:
        - ROS2_WORKSPACE_DIR=${ROS2_WORKSPACE_DIR}
    #deploy:
    #  resources:
    #    limits:
    #      cpus: '0.001'
    #      memory: 500M
    #    reservations:
    #      cpus: '0.0001'
    #      memory: 100M
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY
      - 'ROS2_WORKSPACE_DIR=${ROS2_WORKSPACE_DIR}'
      - 'ROS_DOMAIN_ID=${ROS_DOMAIN_ID}'
      - 'RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}'
    volumes:
      - ${XAUTHORITY:-/dev/null}:/root/.Xauthority:ro
      - ../src:${ROS2_WORKSPACE_DIR}/src
    #command: sleep infinity
    command: ros2 launch peak_ros init.launch.xml
    #restart: unless-stopped

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
      args:
        - ROS2_WORKSPACE_DIR=${ROS2_WORKSPACE_DIR}
    # On its own network, so it cannot meet a driver or robot on the host
    environment:
      - 'RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}'
    command: ${ROS2_WORKSPACE_DIR}/build/peak_ros/peak_ros_integration_test
    profiles:
      - test
